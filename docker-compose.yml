  # ── BACKEND (FastAPI & Celery) ──
  novus-back:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: novus-back
    # 1. SOBRESCRIBIMOS EL COMANDO PARA ACTIVAR EL HOT-RELOAD
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      # 2. CREAMOS EL TÚNEL: Tu código local de Windows -> El contenedor
      - ../backend:/app
      - novus_certificados:/app/storage/certificados
    restart: unless-stopped
    depends_on:
      novus-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: novus-celery-worker
    # Celery en modo dev requiere reiniciar para leer cambios profundos, 
    # pero el volumen ya le dará el código actualizado.
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ../backend:/app  # <-- Volumen agregado aquí también
      - novus_certificados:/app/storage/certificados
    restart: unless-stopped
    depends_on:
      novus-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: novus-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ../backend:/app  # <-- Volumen agregado aquí también
    restart: unless-stopped
    depends_on:
      novus-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── INFRAESTRUCTURA DE DATOS ──
  novus-db:
    image: postgres:16-alpine
    container_name: novus-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - novus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-empower}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novus-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - novus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  novus_pg_data:
  novus_redis_data:
  novus_certificados: